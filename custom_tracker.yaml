# custom_tracker.yaml
# ปรับจาก ByteTrack default ของ ultralytics
# เพิ่ม track_buffer ให้สูงขึ้น เพื่อให้ ID เดิมยังอยู่ต่อแม้กรอบจะหายไปชั่วครู่
# (เช่น โดนบัง/หลุดจากเฟรม) แล้วกลับมาใหม่ จะได้ไม่นับเป็นคนละอันกับของเดิม

tracker_type: bytetrack
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 90     # เดิม 30 -> เพิ่มเป็น 90 (ที่ 30fps ~ รอได้ 3 วินาทีก่อนตัด ID ทิ้ง)
match_thresh: 0.8
fuse_score: true